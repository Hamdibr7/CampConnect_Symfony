parameters:
    images_directory: '%kernel.project_dir%/public/images'

    equipement_images_directory: '%kernel.project_dir%/public/uploads/equipements'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'


    # You can add custom services below, if needed
